<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

 <header>
    <h1>Rock Paper Scissors</h1>
    <p>Can You Outsmart the AI?</p>
</header>

<section>
   <div class="game-board">

    <div class="column">
        <p>You</p>
        <div id="image1">
            <img id="playerHand" src="images/rock.png" width="60px">
        </div>
        <p id="player"></p>
    </div>

    <div class="column">
        <p>v/s</p>
        <p id="result"></p>
    </div>

    <div class="column">
        <p>Computer</p>
        <div id="image2">
            <img id="computerHand" src="images/rock.png" width="60px">
        </div>
        <p id="computer"></p>
    </div>

</div>

    <div class="text">
        <p id="player"></p>
        <p id="computer"></p>
    </div><br>

    <div class="buttons">
        <button class="rock">✊</button>
        <button class="paper">✋</button>
        <button class="scissors">✌️</button>
    </div>

     <div class="score">
        <p id="playerScore">0</p>
        <p id="drawScore">0</p>
        <p id="computerScore">0</p>
    </div>

</section>
</body>
</html>
